# my global config
global:
  scrape_interval: 5s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 5s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "web-server"
    static_configs:
      - targets: ["127.0.0.1:30014"]
       # The label name is added as a label `label_name=<label_value>` to any timeseries scraped from this config.
        labels:
          app: "web"

  - job_name: "master-server"
    static_configs:
      - targets: ["127.0.0.1:30010"]
       # The label name is added as a label `label_name=<label_value>` to any timeseries scraped from this config.
        labels:
          app: "master"   

  - job_name: "center-server"
    static_configs:
      - targets: ["127.0.0.1:30011"]
       # The label name is added as a label `label_name=<label_value>` to any timeseries scraped from this config.
        labels:
          app: "center"  

  - job_name: "gate-1-server"
    static_configs:
      - targets: ["127.0.0.1:30012"]
       # The label name is added as a label `label_name=<label_value>` to any timeseries scraped from this config.
        labels:
          app: "gate-1"  

  - job_name: "game-10001-server"
    static_configs:
      - targets: ["127.0.0.1:30013"]
       # The label name is added as a label `label_name=<label_value>` to any timeseries scraped from this config.
        labels:
          app: "game-10001" 

  - job_name: 'nats'
    scrape_interval: 5s # 建议较短的抓取间隔以应对高并发场景
    static_configs:
      - targets: ["127.0.0.1:7777"]   
