apiVersion: v1
kind: ConfigMap
metadata:
  name: game-config
  namespace: demo-cluster
data:
  demo-cluster.json: |
    {
      "nodes": [
        {
          "id": "gc-center-1",
          "type": "center",
          "port": 3010
        },
        {
          "id": "gc-gate-1",
          "type": "gate",
          "port": 3011
        },
        {
          "id": "gc-game-1",
          "type": "game",
          "port": 3012
        },
        {
          "id": "gc-web-1",
          "type": "web",
          "port": 3013
        }
      ]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: center
  namespace: demo-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: center
  template:
    metadata:
      labels:
        app: center
    spec:
      containers:
      - name: center
        image: demo-cluster:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3010
        env:
        - name: NODE_NAME
          value: gc-center-1
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: ETCD_ENDPOINTS
          value: http://etcd:2379
        - name: NATS_URL
          value: nats://nats:4222
        command: ["./game-server"]
        args: ["center", "--path=./config/demo-cluster.json", "--node=gc-center-1"]
        livenessProbe:
          tcpSocket:
            port: 3010
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 3010
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: center
  namespace: demo-cluster
spec:
  selector:
    app: center
  ports:
  - port: 3010
    targetPort: 3010
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
