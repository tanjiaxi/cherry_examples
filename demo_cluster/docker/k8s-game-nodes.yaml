        command: ["./game-server"]
        args: ["gate", "--path=./config/demo-cluster.json", "--node=gc-gate-1"]
        livenessProbe:
          tcpSocket:
            port: 3011
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 3011
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
