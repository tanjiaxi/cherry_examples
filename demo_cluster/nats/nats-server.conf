# 1. 服务器唯一标识 (每台机器必须不同！)
server_name: nats-1

# 2. 客户端连接端口 (默认 4222)
port: 4222

# 3. HTTP 监控端口 (可选，推荐开启，用于看状态)
http_port: 8222

# 4. 集群配置 (最关键部分)
cluster {
  # 集群名称 (所有节点必须相同！)
  name: my-game-cluster

  # 集群通信端口 (节点间通过这个端口传数据)
  port: 6222

  # 路由列表：告诉这个节点，其他兄弟在哪里
  # 格式：nats://IP:6222
  routes = [
    "nats://192.168.1.11:6222",
    "nats://192.168.1.12:6222",
    "nats://192.168.1.13:6222"
  ]
}

# 5. (可选) 开启 JetStream 持久化
# jetstream {
#   store_dir: "/data/nats-jetstream"
# }